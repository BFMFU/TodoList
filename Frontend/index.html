<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusDo - Quản Lý Công Việc & Nhiệm Vụ (Spring Boot Ready)</title>
  <meta name="description" content="Giao diện Frontend Todo List hiện đại, tối giản, tương thích chuẩn Spring Boot REST API">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Enhanced CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col items-center py-8 px-4 sm:px-6 transition-colors duration-300 font-sans">

  <!-- Main Application Wrapper -->
  <main class="w-full max-w-2xl flex flex-col gap-5">

    <!-- Top Header -->
    <header class="flex items-center justify-between pb-2 border-b border-slate-200/70 dark:border-slate-800">
      <div class="flex flex-col gap-1">
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
            <span class="bg-indigo-600 text-white p-1.5 rounded-lg shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
              </svg>
            </span>
            FocusDo
          </h1>
          <!-- Dynamic Badge: Mock or Live API -->
          <div id="modeBadge" class="transition-all"></div>
        </div>
        <p id="currentDate" class="text-xs text-slate-500 dark:text-slate-400 font-medium"></p>
      </div>

      <!-- Right Header Actions -->
      <div class="flex items-center gap-2">
        <button 
          type="button" 
          id="themeToggleBtn" 
          class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-500 hover:text-slate-900 dark:hover:text-white shadow-sm hover:shadow transition-all"
          title="Chuyển chế độ Sáng / Tối"
        >
          <!-- Sun Icon (Shown in Dark) -->
          <svg class="w-5 h-5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" stroke-width="2"></circle>
            <path stroke-width="2" stroke-linecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <!-- Moon Icon (Shown in Light) -->
          <svg class="w-5 h-5 block dark:hidden text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Create Task Card -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm hover:shadow-md transition-shadow">
      <div class="flex flex-col gap-3">
        <!-- Input Title -->
        <div class="flex items-center gap-2.5">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 flex-shrink-0 animate-ping"></div>
          <input 
            type="text" 
            id="newTodoTitle" 
            placeholder="Thêm nhiệm vụ mới cần hoàn thành... (Nhấn Enter)" 
            maxlength="150"
            autocomplete="off"
            class="w-full text-base font-medium bg-transparent border-none text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none"
          />
        </div>

        <!-- Input Description -->
        <textarea
          id="newTodoDescription"
          rows="2"
          maxlength="1000"
          placeholder="Mô tả chi tiết (tùy chọn)..."
          class="w-full pl-5 text-sm bg-transparent border-none resize-none text-slate-600 dark:text-slate-300 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none"
        ></textarea>

        <!-- Meta Selectors (Priority, Due Date, Add Button) -->
        <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800/80 flex-wrap gap-2.5">
          <div class="flex items-center gap-2 flex-wrap">
            <!-- Priority Selector -->
            <select 
              id="newTodoPriority" 
              class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer"
            >
              <option value="MEDIUM">Ưu tiên: Vừa</option>
              <option value="HIGH">Ưu tiên: Cao</option>
              <option value="LOW">Ưu tiên: Thấp</option>
            </select>

            <!-- Due Date Picker -->
            <input 
              type="date" 
              id="newTodoDueDate" 
              class="text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer"
              title="Chọn hạn chót (Due date)"
            />
          </div>

          <!-- Add Button -->
          <button 
            type="button" 
            id="addTodoBtn" 
            class="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm hover:shadow transition-all transform active:scale-95"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
            </svg>
            Thêm việc
          </button>
        </div>
      </div>
    </section>

    <!-- Search & Filter Controls -->
    <section class="flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between">
      <!-- Search Input with Debounce -->
      <div class="relative flex-1">
        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Tìm kiếm công việc nhanh..." 
          autocomplete="off"
          class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
        />
        <button 
          type="button" 
          id="clearSearchBtn" 
          class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden"
          title="Xóa tìm kiếm"
        >
          ✕
        </button>
      </div>

      <!-- Priority Filter (gửi lên Backend ?priority=) -->
      <select
        id="priorityFilter"
        class="text-xs font-semibold px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer shadow-sm"
        title="Lọc theo mức ưu tiên"
      >
        <option value="">Mọi ưu tiên</option>
        <option value="HIGH">Ưu tiên: Cao</option>
        <option value="MEDIUM">Ưu tiên: Vừa</option>
        <option value="LOW">Ưu tiên: Thấp</option>
      </select>

      <!-- Filter Buttons -->
      <div class="flex items-center p-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm self-start sm:self-auto">
        <button 
          type="button" 
          class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-400"
          data-filter="ALL"
        >
          Tất cả <span id="countAll" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
        </button>
        <button 
          type="button" 
          class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all flex items-center gap-1.5"
          data-filter="ACTIVE"
        >
          Đang làm <span id="countActive" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
        </button>
        <button 
          type="button" 
          class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all flex items-center gap-1.5"
          data-filter="COMPLETED"
        >
          Đã xong <span id="countCompleted" class="text-[10px] px-1.5 py-0.2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">0</span>
        </button>
      </div>
    </section>

    <!-- Progress Card -->
    <section class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-xl p-3.5 shadow-sm flex flex-col gap-2">
      <div class="flex items-center justify-between text-xs font-semibold text-slate-600 dark:text-slate-400">
        <span id="progressFraction">0/0 hoàn thành</span>
        <span id="progressPercent" class="text-indigo-600 dark:text-indigo-400">0%</span>
      </div>
      <div class="w-full h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
        <div id="progressFill" class="h-full bg-gradient-to-r from-indigo-500 to-indigo-600 rounded-full transition-all duration-300 w-0"></div>
      </div>
    </section>

    <!-- Task List Area -->
    <section class="flex flex-col gap-2.5 min-h-[160px] relative">
      <!-- Loading Skeleton Indicator -->
      <div id="loadingSkeleton" class="flex flex-col gap-2.5 hidden">
        <div class="h-16 rounded-xl animate-shimmer"></div>
        <div class="h-16 rounded-xl animate-shimmer"></div>
        <div class="h-16 rounded-xl animate-shimmer"></div>
      </div>

      <!-- Task Items Container -->
      <div id="todoListContainer" class="flex flex-col gap-2.5"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden flex-col items-center justify-center p-8 bg-white dark:bg-slate-900 border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl text-center gap-2">
        <div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h3 class="empty-title text-sm font-semibold text-slate-700 dark:text-slate-200">Chưa có công việc nào</h3>
        <p class="empty-desc text-xs text-slate-400 dark:text-slate-500 max-w-xs">Hãy tạo thêm nhiệm vụ mới để bắt đầu quản lý ngày làm việc hiệu quả.</p>
      </div>
    </section>

    <!-- Footer Controls -->
    <footer class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 pt-2 border-t border-slate-200/70 dark:border-slate-800">
      <span id="activeCountText">0 công việc còn lại</span>
      <button 
        type="button" 
        id="clearCompletedBtn" 
        class="inline-flex items-center gap-1 font-medium hover:text-rose-600 dark:hover:text-rose-400 transition-colors px-2 py-1 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        Xóa việc đã xong
      </button>
    </footer>
  </main>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Modular Scripts Architecture -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
